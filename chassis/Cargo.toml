[package]
name = "tracked-chassis"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "custom:A:/.embuild/espressif"

[[bin]]
name = "tracked-chassis"
harness = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dependencies]
esp-common = { path = "../esp_common" }
anyhow = "1"
embassy-executor = { version = "0.7", features = ["executor-thread", "arch-std"] }
embassy-time = "0.4"
embedded-svc = "0.28"
esp-idf-hal = "0.45.2"
esp-idf-svc = { version = "0.51", features = ["embassy-time-driver", "embassy-sync"] }
log = "0.4"
static_cell = "2"
shared-protocol = { path = "../shared_protocol", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-json-core = { version = "0.6", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["chassis", "arm"]
chassis = []
arm = ["dep:shared-protocol", "dep:serde", "dep:serde-json-core", "dep:serde_json"]

[build-dependencies]
embuild = "0.33"
