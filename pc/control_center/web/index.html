<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP Robot 控制中心</title>
<style>
body{margin:24px;background:#081018;color:#edf6fa;font:14px Arial}
.card{background:#111d27;border:1px solid #284050;border-radius:8px;padding:20px;margin:12px auto;max-width:1000px}
button{padding:16px;margin:4px;background:#182c3b;color:white;border:1px solid #3b586b;border-radius:6px}
input,select{background:#0c1720;color:white;padding:10px;border:1px solid #284050}
.joint{display:grid;grid-template-columns:72px minmax(120px,360px) 56px;gap:10px;margin:10px 4px;align-items:center}.joint input{width:100%;margin:0;box-sizing:border-box}.joint input[type=range]{padding:0;background:transparent;border:0}.joint output{text-align:right;font-variant-numeric:tabular-nums}
.joint-limit{color:#9aaab5}
.joint-limit{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin:8px 4px}.joint-limit input{width:100%;box-sizing:border-box}
.arm-options{display:flex;align-items:center;gap:16px;margin:12px 4px}
#realtime{accent-color:#43c59e}
</style>
<h1>ESP Robot 控制中心</h1>
<p>底盘与机械臂 · 局域网自动发现　<span id="status">等待设备</span></p>
<section class="card">
  <h2>底盘控制</h2>
  <input id="speed" type="range" min="50" max="850" value="300">
  <div>
    <button data-a="forward">▲ 前进</button><button data-a="left">◀ 左转</button>
    <button id="stop">■ 急停</button><button data-a="right">▶ 右转</button>
    <button data-a="reverse">▼ 后退</button>
  </div>
</section>
<section class="card">
  <h2>实时状态</h2>
  控制源 <b id="source">--</b>　底盘 <b id="peer">--</b>
  左 PWM <b id="pl">0</b>　右 PWM <b id="pr">0</b>　发现设备 <b id="dc">0</b>
</section>
<section class="card">
  <h2>机械臂控制</h2>
  <select id="dev"><option>正在搜索机械臂…</option></select>
  <input id="host" placeholder="机械臂 IP 地址">
  <div class="arm-options">
    <label>机械臂速度 <input id="armSpeed" type="range" min="10" max="300" value="100" step="5"></label>
    <output id="armSpeedText">100%</output>
  </div>
  <div id="joints"></div>
  <h3>关节软限位（度）</h3>
  <div id="limits"></div>
  <button id="saveLimits">保存关节限位</button><span id="limitsStatus"></span>
  <div class="arm-options">
    <label><input id="realtime" type="checkbox" checked> 实时模式（拖动关节滑块时自动发送）</label>
  </div>
  <button id="send">发送目标</button><button id="home">回零</button>
  <button id="saveStartup">保存为上电姿态</button><span id="startupStatus">未标定</span>
</section>
<script>
const $=x=>document.getElementById(x);
const post=(u,d={})=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).catch(()=>{});
const vec={forward:[1,1],reverse:[-1,-1],left:[-1,1],right:[1,-1]};
let act,t;
function end(){clearInterval(t);act=null;post('/api/stop')}
function start(k){end();act=k;let f=()=>{let s=+$('speed').value;post('/api/control',{left:vec[k][0]*s,right:vec[k][1]*s,armed:true})};f();t=setInterval(f,100)}
document.querySelectorAll('[data-a]').forEach(b=>{b.onpointerdown=()=>start(b.dataset.a);b.onpointerup=end});
$('stop').onclick=end;
const jointMinimum=Array(5).fill(-90),jointMaximum=Array(5).fill(90);
function paintJointRange(i){const x=document.querySelectorAll('.joint input[type=range]')[i],low=(jointMinimum[i]+90)/180*100,high=(jointMaximum[i]+90)/180*100;x.style.background=`linear-gradient(to right,#68747d 0%,#68747d ${low}%,#43c59e ${low}%,#43c59e ${high}%,#68747d ${high}%,#68747d 100%)`}
for(let i=1;i<=5;i++){
  let r=document.createElement('div');r.className='joint';
  r.innerHTML=`关节${i}<input type="range" min="-90" max="90" value="0"><output>0°</output>`;
  let x=r.querySelector('input'),o=r.querySelector('output');
  x.oninput=()=>{const v=Math.max(jointMinimum[i-1],Math.min(jointMaximum[i-1],Number(x.value)));x.value=v;lastArmEdit=Date.now();o.textContent=v+'°';scheduleArmSend()};
  $('joints').append(r)
  const limit=document.createElement('div');limit.className='joint-limit';
  limit.innerHTML=`关节${i}<input class="limit-min" type="number" min="-180" max="180" value="-90" aria-label="关节${i}最小角度"><input class="limit-max" type="number" min="-180" max="180" value="90" aria-label="关节${i}最大角度">`;
  $('limits').append(limit);
}
function pick(h){$('host').value=h;$('dev').value=h}
$('dev').onchange=e=>pick(e.target.value);
function sendArm(){
  const host=$('host').value.trim();
  if(!host)return;
  post('/api/arm',{host,position:[...document.querySelectorAll('.joint input')].map(x=>+x.value*Math.PI/180),speed_scale:+$('armSpeed').value/100})
}
async function saveStartupPose(){
  const host=$('host').value.trim();
  if(!host){$('startupStatus').textContent='请先选择机械臂';return}
  const position=[...document.querySelectorAll('.joint input')].map(x=>+x.value*Math.PI/180);
  lastStartupRequest={position:position.map(v=>v*180/Math.PI),at:Date.now()};
  const response=await fetch('/api/arm/startup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host,position})}).catch(()=>null);
  $('startupStatus').textContent=response&&response.ok?'保存请求已发送，等待设备确认':'发送失败';
}
$('saveStartup').onclick=saveStartupPose;
async function saveJointLimits(){
  const host=$('host').value.trim();
  const rows=[...document.querySelectorAll('.joint-limit')];
  const min_deg=rows.map(r=>Number(r.querySelector('.limit-min').value));
  const max_deg=rows.map(r=>Number(r.querySelector('.limit-max').value));
  if(!host||min_deg.some((v,i)=>!Number.isFinite(v)||!Number.isFinite(max_deg[i])||v>=max_deg[i])){$('limitsStatus').textContent='地址或限位值无效';return}
  lastLimitsRequest={min_deg,max_deg};
  const response=await fetch('/api/arm/limits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host,min_deg,max_deg})}).catch(()=>null);
  $('limitsStatus').textContent=response&&response.ok?'等待 ESP32 确认限位':'保存失败';
}
$('saveLimits').onclick=saveJointLimits;
let limitsEdited=false,lastLimitsRequest=null;
document.querySelectorAll('.joint-limit input').forEach(x=>x.oninput=()=>{limitsEdited=true});
function syncJointLimits(minimum,maximum){
  if(!Array.isArray(minimum)||!Array.isArray(maximum)||minimum.length!==5||maximum.length!==5)return;
  const confirmed=lastLimitsRequest&&minimum.every((v,i)=>Math.abs(Number(v)-lastLimitsRequest.min_deg[i])<0.1)&&maximum.every((v,i)=>Math.abs(Number(v)-lastLimitsRequest.max_deg[i])<0.1);
  if(!limitsEdited||confirmed){
    document.querySelectorAll('.joint-limit').forEach((r,i)=>{r.querySelector('.limit-min').value=Number(minimum[i]).toFixed(1);r.querySelector('.limit-max').value=Number(maximum[i]).toFixed(1)});
    minimum.forEach((v,i)=>{jointMinimum[i]=Number(v);jointMaximum[i]=Number(maximum[i]);const x=document.querySelectorAll('.joint input[type=range]')[i];x.min=-90;x.max=90;x.value=Math.max(-90,Math.min(90,Number(x.value)));paintJointRange(i)});
    if(confirmed){limitsEdited=false;$('limitsStatus').textContent='ESP32 已确认限位';}
  }
}
let lastStartupRequest=null;
let armSendTimer,lastArmSend=0,lastArmEdit=0;
function syncArmFromTelemetry(angles){
  // Do not let a stale telemetry packet overwrite a value while the user is
  // dragging or immediately after a command was sent.
  if(Date.now()-lastArmEdit<1500)return;
  if(!Array.isArray(angles)||angles.length!==5)return;
  document.querySelectorAll('.joint input').forEach((x,i)=>{
    const value=Math.max(jointMinimum[i],Math.min(jointMaximum[i],Number(angles[i])));
    if(!Number.isFinite(value))return;
    x.value=value;
    x.nextElementSibling.textContent=value.toFixed(1)+'°';
  });
}
function scheduleArmSend(){
  if(!$('realtime').checked)return;
  clearTimeout(armSendTimer);
  const delay=Math.max(0,100-(Date.now()-lastArmSend));
  armSendTimer=setTimeout(()=>{lastArmSend=Date.now();lastArmEdit=Date.now();sendArm()},delay)
}
$('send').onclick=()=>{lastArmEdit=Date.now();sendArm()};
$('armSpeed').oninput=()=>{$('armSpeedText').textContent=$('armSpeed').value+'%';lastArmEdit=Date.now();scheduleArmSend()};
$('home').onclick=()=>{lastArmEdit=Date.now();document.querySelectorAll('.joint input').forEach(x=>{x.value=0;x.nextElementSibling.textContent='0°'});sendArm()};
async function refresh(){
  try{
    let s=await fetch('/api/state').then(r=>r.json()),t=s.telemetry||{};
    syncArmFromTelemetry(Array.isArray(t.target_deg)?t.target_deg:t.current_deg);
    syncJointLimits(t.min_angle_deg,t.max_angle_deg);
    if(lastStartupRequest&&Date.now()-lastStartupRequest.at<10000){
      const saved=t.startup_calibrated&&Array.isArray(t.startup_deg)&&t.startup_deg.length===5&&t.startup_deg.every((v,i)=>Math.abs(Number(v)-lastStartupRequest.position[i])<0.2);
      $('startupStatus').textContent=saved?'上电姿态已确认保存':'等待 ESP32 确认保存…';
    }else{
      $('startupStatus').textContent=t.startup_calibrated?'已标定：'+(t.startup_deg||[]).map(v=>Number(v).toFixed(1)+'°').join(', '):'未标定';
    }
    $('status').textContent=s.online?'设备在线':'等待设备';$('source').textContent=t.source||'--';
    $('peer').textContent=s.peer||'--';$('pl').textContent=t.pwm_left||0;$('pr').textContent=t.pwm_right||0;
    let a=(s.devices||[]).filter(d=>d.device==='arm'||d.control_port===8888||d.type==='hello');
    $('dc').textContent=(s.devices||[]).length;
    $('dev').innerHTML=a.length?a.map(d=>`<option value="${d.peer}">${d.name||'机械臂'} · ${d.peer}</option>`):'<option value="">未发现机械臂</option>';
    if(a[0]&&!$('host').value)pick(a[0].peer)
  }catch{}
}
setInterval(refresh,500);refresh();
</script>
